Screens:
  StartScreen:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
    Children:
      - ScreenContainer1:
          Control: GroupContainer@1.3.0
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(245, 245, 245, 1)
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =16
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =16
            Width: =Parent.Width
          Children:
            - HeaderContainer1:
                Control: GroupContainer@1.3.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =75
                  LayoutDirection: =LayoutDirection.Horizontal
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                Children:
                  - Header1:
                      Control: Header@0.0.44
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 1)
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =0
                        Fill: =RGBA(255, 255, 255, 1)
                        Font: ="Aptos"
                        FontColor: =RGBA(0, 0, 0, 1)
                        Logo: =AdobeStock_131107922
                        LogoTooltip: ="Back"
                        OnSelectLogo: =Navigate(LandingScreen)
                        Title: |-
                          ="Event Experience Platform 
                          "
            - MainContainer1:
                Control: GroupContainer@1.3.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(245, 245, 245, 1)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =16
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  LayoutWrap: =true
                  PaddingBottom: =2
                  PaddingLeft: =2
                  PaddingRight: =2
                  PaddingTop: =2
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - Container1:
                      Control: GroupContainer@1.3.0
                      Variant: AutoLayout
                      Properties:
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =5
                        LayoutJustifyContent: =LayoutJustifyContent.Center
                        LayoutMinHeight: =300
                        LayoutMinWidth: =If(StartScreen.Size = ScreenSize.Small, Parent.Width, 400)
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        PaddingBottom: =10
                        PaddingLeft: =5
                        PaddingRight: =5
                        PaddingTop: =10
                        Width: =800
                      Children:
                        - ImageContainer1:
                            Control: GroupContainer@1.3.0
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              DropShadow: =DropShadow.None
                              FillPortions: =1.5
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =5
                              LayoutJustifyContent: =LayoutJustifyContent.End
                              LayoutMinWidth: =Container1.Width
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =Parent.Width
                            Children:
                              - Image1:
                                  Control: Image@2.2.3
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Height: =200
                                    Image: =AdobeStock_266936504
                                    ImagePosition: =ImagePosition.Fill
                                    OnSelect: =Navigate(RegisterScreen)
                                    RadiusBottomLeft: =90
                                    RadiusBottomRight: =90
                                    RadiusTopLeft: =90
                                    RadiusTopRight: =90
                                    Width: =200
                        - TitleContainer1:
                            Control: GroupContainer@1.3.0
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              DropShadow: =DropShadow.None
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutMinWidth: =Container1.Width
                              PaddingTop: =20
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =Parent.Width
                            Children:
                              - FeatureItemButton1:
                                  Control: Button@0.0.45
                                  Properties:
                                    AccessibleLabel: ="Featured item button"
                                    Appearance: ='ButtonCanvas.Appearance'.Transparent
                                    Font: ="Aptos"
                                    FontSize: =32
                                    FontWeight: =FontWeight.Bold
                                    Height: =45
                                    LayoutMinWidth: =Parent.Width
                                    OnSelect: =Navigate(RegisterScreen)
                                    Text: ="Registration"
                                    Width: =Parent.Width
                              - DescriptionText1:
                                  Control: Text@0.0.51
                                  Properties:
                                    Align: ='TextCanvas.Align'.Center
                                    FillPortions: =1
                                    Font: ="Aptos"
                                    LayoutMinWidth: =Parent.Width
                                    Size: =26
                                    Text: ="Register for a Deloitte Event"
                                    VerticalAlign: =VerticalAlign.Top
                                    Width: =Parent.Width
                  - Container21:
                      Control: GroupContainer@1.3.0
                      Variant: AutoLayout
                      Properties:
                        Fill: =RGBA(255, 255, 255, 1)
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =5
                        LayoutJustifyContent: =LayoutJustifyContent.Center
                        LayoutMinHeight: =300
                        LayoutMinWidth: =If(StartScreen.Size = ScreenSize.Small, Parent.Width, 400)
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        PaddingBottom: =10
                        PaddingLeft: =5
                        PaddingRight: =5
                        PaddingTop: =10
                      Children:
                        - ImageContainer21:
                            Control: GroupContainer@1.3.0
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              DropShadow: =DropShadow.None
                              FillPortions: =1.5
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =5
                              LayoutJustifyContent: =LayoutJustifyContent.End
                              LayoutMinWidth: =Container21.Width
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =Parent.Width
                            Children:
                              - Image21:
                                  Control: Image@2.2.3
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Height: =200
                                    Image: =AdobeStock_79568047
                                    ImagePosition: =ImagePosition.Fill
                                    OnSelect: =Navigate(MyEventsScreen)
                                    RadiusBottomLeft: =90
                                    RadiusBottomRight: =90
                                    RadiusTopLeft: =90
                                    RadiusTopRight: =90
                                    Width: =200
                        - TitleContainer21:
                            Control: GroupContainer@1.3.0
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              DropShadow: =DropShadow.None
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutMinWidth: =Container21.Width
                              PaddingTop: =20
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =Parent.Width
                            Children:
                              - FeatureItemButton21:
                                  Control: Button@0.0.45
                                  Properties:
                                    AccessibleLabel: ="Featured item button"
                                    Appearance: ='ButtonCanvas.Appearance'.Transparent
                                    Font: ="Aptos"
                                    FontSize: =32
                                    FontWeight: =FontWeight.Bold
                                    Height: =45
                                    LayoutMinWidth: =Parent.Width
                                    OnSelect: =Navigate(MyEventsScreen)
                                    Text: ="My Events"
                                    Width: =Parent.Width
                              - DescriptionText21:
                                  Control: Text@0.0.51
                                  Properties:
                                    Align: ='TextCanvas.Align'.Center
                                    FillPortions: =1
                                    Font: ="Aptos"
                                    LayoutMinWidth: =Parent.Width
                                    Size: =26
                                    Text: ="Check Registration Status / Cancel"
                                    VerticalAlign: =VerticalAlign.Top
                                    Width: =Parent.Width
      - Icon1:
          Control: Classic/Icon@2.5.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 1)
            Color: =RGBA(0, 0, 0, 1)
            Height: =50
            Icon: =Icon.Settings
            OnSelect: =Navigate(SettingsScreen)
            Visible: =If(IsBlank(LookUp(Admins,'Admin Account'.Email =User().Email).'Admin Account'.Email),false,true)
            Width: =44
            X: =1212
            Y: =28
