                                    - Container24_19:
                                        Control: GroupContainer@1.3.0
                                        Variant: ManualLayout
                                        Properties:
                                          AlignInContainer: =AlignInContainer.SetByContainer
                                          DropShadow: =DropShadow.None
                                          Height: =40
                                          LayoutMinWidth: =150
                                        Children:
                                          - ButtonCanvas1_26:
                                              Control: Button@0.0.45
                                              Properties:
                                                Align: =Align.Center
                                                Appearance: |+
                                                  =If(
                                                      Or(
                                                          IsBlank(cbAnrede_1.Selected.Value),    // Wenn das Anrede-Feld leer ist
                                                          IsBlank(tGivenName_1.Value),           // Wenn der Vorname leer ist
                                                          IsBlank(tLastName_1.Value),            // Wenn der Nachname leer ist
                                                          IsBlank(tEmail_1.Value),               // Wenn die E-Mail leer ist
                                                          If( Gallery3.Selected.'Essenswünsche visible', IsBlank(tFood.Selected.Value), false), // Wenn das Startblock-Feld leer ist
                                                          If(Container5_20.Visible = true, IsBlank( tFood_3.Selected.Value ), ""  ),
                                                      If(Container5_109.Visible = true, IsBlank( tFood_2.Selected.Value ), ""  ),
                                                      If(Container5_113.Visible = true, IsBlank( tAllergies_2.Value ), ""  ),
                                                      If(Container5_111.Visible = true, IsBlank( tFood_4.Selected.Value ), ""  ),
                                                      If(Container5_112.Visible = true, IsBlank( tFood_5.Selected.Value ), ""  )
                                                      ),
                                                      "Warning",  // Farbe, wenn Felder fehlen (Sekundäre Farbe - z.B. Grau)
                                                      If(
                                                          LookUp(Events, Title = Gallery3.Selected.Title).ID in ShowColumns(LookUp('Event visitors', Email = tEmail_1.Value).'Event registered', Value),
                                                          "Warning",  // Farbe, wenn der Benutzer bereits registriert ist (z.B. Gelb)
                                                          "Primary"   // Andernfalls die primäre Farbe (z.B. Blau) für einen aktiven Button
                                                      )
                                                  )
                                                BorderStyle: =BorderStyle.Solid
                                                BorderThickness: =0
                                                DisplayMode: =
                                                Height: =30
                                                Icon: ="Send"
                                                IconStyle: ='ButtonCanvas.IconStyle'.Outline
                                                OnSelect: "=Set(varShowSpinner, true);\n\n// Pflichtfelder prüfen\nIf(\n    Or(\n        IsBlank(cbAnrede_1.Selected.Value),\n        IsBlank(tGivenName_1.Value),\n        IsBlank(tLastName_1.Value),\n        IsBlank(tEmail_1.Value),\n        If(Container5_20.Visible, IsBlank(tFood_3.Selected.Value), false),\n        If(Container5_109.Visible, IsBlank(tFood_2.Selected.Value), false),\n        If(Container5_111.Visible, IsBlank(tFood_4.Selected.Value), false),\n        If(Container5_112.Visible, IsBlank(tFood_5.Selected.Value), false)\n    ),\n    \n    // Pflichtfelder fehlen\n    Notify(\"Please complete all required fields before proceeding.\", NotificationType.Warning);\n    Set(varShowSpinner, false),\n    \n    // Bypass-Check: Ist es das Assistenz-Meeting?\n    If(\n        Gallery3.Selected.Title = \"Assistenz Meeting 2026\",\n        \n        // TEST-EVENT: Direkt registrieren ohne Duplikat-Prüfung\n        With(\n            {\n                result: Patch(\n                    Anmeldungen,\n                    Defaults(Anmeldungen),\n                    {\n                        Title: tGivenName_1.Value & \" \" & tLastName_1.Value,\n                        Anrede: cbAnrede_1.Selected.Value,\n                        Vorname: tGivenName_1.Value,\n                        Nachname: tLastName_1.Value,\n                        'CompanyName (field_17)': Coalesce(tCompany_1.Value, \"Keine Angabe\"),\n                        Department: Coalesce(tDepatment_1.Value, \"Keine Angabe\"), \n                        JobTitle: Coalesce(tJobTitle.Value, \"Keine Angabe\"),\n                        Office: Coalesce(tParticipantOfficeLocation.Value, \"Keine Angabe\"),\n                        Email: tEmail_1.Value,\n                        ItemID: Gallery3.Selected.ID,\n                        EventType: {Value: \"OtherDeloitteEvent\"},\n                        FoodPreferences: Coalesce(tFood.Selected.Value, \"Keine Angabe\"),\n                        Allergies: Coalesce(tAllergies.Value, \"Keine Angabe\"),\n                        'Hotel required': CheckboxCanvas1.Checked,\n                        'Room Type': If(CheckboxCanvas1.Checked, tFood_2.Selected.Value, \"N/A\"),\n                        'Preferred roommate ': If(CheckboxCanvas1.Checked, ComboBox2_2.Selected.Email, \"\"),\n                        'Freitextfeld 1': Coalesce(tAllergies_2.Value, \"N/A\"),\n                        'Freitextfeld 2': Coalesce(tAllergies_3.Value, \"N/A\"),\n                        'Dropdownfeld 1': Coalesce(tFood_3.Selected.Value, \"N/A\"),\n                        'Dropdownfeld 2': Coalesce(tFood_4.Selected.Value, \"N/A\"),\n                        TShirtGroesse: Coalesce(tFood_5.Selected.Value, \"N/A\")\n                    }\n                )\n            },\n            If(\n                !IsBlank(result),\n                Set(varShowSpinner, false);\n                Navigate(ScreenSuccessRegistration, ScreenTransition.Fade),\n                Notify(\"Registration failed. Please try again.\", NotificationType.Error);\n                Set(varShowSpinner, false)\n            )\n        ),\n        \n        // NORMALER ABLAUF: Mit Duplikat-Prüfungen\n        If(\n            !IsBlank(\n                LookUp(\n                    Anmeldungen,\n                    Email = tEmail_1.Value && ItemID = Gallery3.Selected.ID\n                )\n            ),\n            \n            // Bereits lokal registriert\n            Notify(\"You have already registered with this email address.\", NotificationType.Warning);\n            Set(varShowSpinner, false),\n            \n            If(\n                varEventCheck.registered = \"True\",\n                \n                // Bereits registriert\n                Notify(\"You are already registered for this event.\", NotificationType.Warning);\n                Set(varShowSpinner, false),\n                \n                // Kann registrieren\n                With(\n                    {\n                        result: Patch(\n                            Anmeldungen,\n                            Defaults(Anmeldungen),\n                            {\n                                Title: tGivenName_1.Value & \" \" & tLastName_1.Value,\n                                Anrede: cbAnrede_1.Selected.Value,\n                                Vorname: tGivenName_1.Value,\n                                Nachname: tLastName_1.Value,\n                                'CompanyName (field_17)': Coalesce(tCompany_1.Value, \"Keine Angabe\"),\n                                Department: Coalesce(tDepatment_1.Value, \"Keine Angabe\"), \n                                JobTitle: Coalesce(tJobTitle.Value, \"Keine Angabe\"),\n                                Office: Coalesce(tParticipantOfficeLocation.Value, \"Keine Angabe\"),\n                                Email: tEmail_1.Value,\n                                ItemID: Gallery3.Selected.ID,\n                                EventType: {Value: \"OtherDeloitteEvent\"},\n                                FoodPreferences: Coalesce(tFood.Selected.Value, \"Keine Angabe\"),\n                                Allergies: Coalesce(tAllergies.Value, \"Keine Angabe\"),\n                                'Hotel required': CheckboxCanvas1.Checked,\n                                'Room Type': If(CheckboxCanvas1.Checked, tFood_2.Selected.Value, \"N/A\"),\n                                'Preferred roommate ': If(CheckboxCanvas1.Checked, ComboBox2_2.Selected.Email, \"\"),\n                                'Freitextfeld 1': Coalesce(tAllergies_2.Value, \"N/A\"),\n                                'Freitextfeld 2': Coalesce(tAllergies_3.Value, \"N/A\"),\n                                'Dropdownfeld 1': Coalesce(tFood_3.Selected.Value, \"N/A\"),\n                                'Dropdownfeld 2': Coalesce(tFood_4.Selected.Value, \"N/A\"),\n                                TShirtGroesse: Coalesce(tFood_5.Selected.Value, \"N/A\")\n                            }\n                        )\n                    },\n                    If(\n                        !IsBlank(result),\n                        Set(varShowSpinner, false);\n                        Navigate(ScreenSuccessRegistration, ScreenTransition.Fade),\n                        Notify(\"Registration failed. Please try again.\", NotificationType.Error);\n                        Set(varShowSpinner, false)\n                    )\n                )\n            )\n        )\n    )\n)"
                                                Text: |-
                                                  =If(
                                                      And(
                                                          Gallery3.Selected.Title = "Assistenz Meeting 2026",
                                                          varEventCheck.registered = "True"
                                                      ),
