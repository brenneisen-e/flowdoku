                    If( !IsBlank(LookUp(Abmeldungen, Email = User().Email)), Notify("You have already requested the cancellation of the event. Please note that this process may take some time.", NotificationType.Error, 6000); Set(varModalDialog, false),
                    Patch(
                                    Abmeldungen,
                                    Defaults(Abmeldungen),
                                    {
                                        Title: varItem,
                                        Email: User().Email,
                                        TeilnehmerID: LookUp('Event visitors',Email= User().Email).ID
                                    }
                                );
                    Set(varModalDialog, false)
                    ;
                    Navigate(ScreeSuccessDeregistration, ScreenTransition.Fade)
                    )


