Screens:
  AllEventsScreen:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
    Children:
      - ScreenContainer6:
          Control: GroupContainer@1.3.0
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(245, 245, 245, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =16
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =16
            Width: =Parent.Width
          Children:
            - HeaderContainer6:
                Control: GroupContainer@1.3.0
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =75
                  LayoutDirection: =LayoutDirection.Horizontal
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                Children:
                  - Header6:
                      Control: Header@0.0.44
                      Properties:
                        Fill: =RGBA(255, 255, 255, 1)
                        FontColor: =RGBA(0, 0, 0, 1)
                        Logo: =AdobeStock_131107922
                        LogoTooltip: ="Back"
                        OnSelectLogo: =Navigate(StartScreen)
                        Title: ="All events"
            - MainContainer6:
                Control: GroupContainer@1.3.0
                Variant: AutoLayout
