App:
  Properties:
    OnStart: |-
      =// Definiere die globalen Variablen im OnStart-Ereignis

      Set(varRegistrationData, {});

      Set(varRegAttempts, 0);

      Set(varMaxAttempts, 5);

      Set(varRegistrationInProgress, false);

      Set(varPatchResult, {});
      Set(varShowSpinner, false);
      Set(
          LoadExcelDataOnStart,
          false
      );
    StartScreen: =LandingScreen
    Theme: =GreenTheme
