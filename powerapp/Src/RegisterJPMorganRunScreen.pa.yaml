Screens:
  RegisterJPMorganRunScreen:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =ClearCollect(colStartblock,Filter(Events,ID=Gallery3.Selected.ID).Startblock);
        ClearCollect(
            colFlattened,
            Ungroup(colStartblock, Startblock)
        );
        ClearCollect(colTShirtGroesse, Filter(Events,ID=Gallery3.Selected.ID).'T-Shirtgrößen');

        ClearCollect(
            colFlattenedTShirt,
            Ungroup(colTShirtGroesse, 'T-Shirtgrößen')
        );
        Set(varAssistancetrue,false);
        Set(CurrentUser,{    
                '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",    
                Claims: "i:0#.f|membership|" & Lower(User().Email),    
                Department:Office365Users.UserProfile(User().Email).Department,
                CompanyName:Office365Users.UserProfile(User().Email).CompanyName,      
                DisplayName: User().FullName,
                LastName:Office365Users.UserProfile(User().Email).Surname,
                FirstName:Office365Users.UserProfile(User().Email).GivenName,    
                Email: User().Email,    
                JobTitle: Office365Users.UserProfile(User().Email).JobTitle ,        
                Office:  Office365Users.UserProfile(User().Email).OfficeLocation,   
                Picture: "."           
            });
        Reset(cbAnrede_2);
        Reset(tNumber_3);
        Reset(tCompany_2);
        Reset(tDepatment_2);
