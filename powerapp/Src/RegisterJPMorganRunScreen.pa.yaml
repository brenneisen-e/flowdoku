                                                OnSelect: "=Set(varShowSpinner, true);\n\nIf(\n    Or(\n        // Pflichtfelder prüfen\n        IsBlank(cbAnrede_2.Selected.Value),\n        IsBlank(tGivenName_2.Value),\n        IsBlank(tLastName_2.Value),\n        IsBlank(tEmail_2.Value),\n\n        // Bereits für Event registriert\n        LookUp(\n            Events, \n            Title = Gallery3.Selected.Title\n        ).ID in ShowColumns(\n            LookUp('Event visitors', Email = tEmail_2.Value).'Event registered', \n            Value\n        ),\n\n        // E-Mail bereits in \"Anmeldungen\" vorhanden\n        !IsBlank(\n            LookUp(Anmeldungen, Email = tEmail_2.Value)\n        )\n    ),\n\n    // Wenn eine der Bedingungen zutrifft\n    With(\n        {\n            notifyMessage: If(\n                Or(\n                    IsBlank(cbAnrede_2.Selected.Value),\n                    IsBlank(tGivenName_2.Value),\n                    IsBlank(tLastName_2.Value),\n                    IsBlank(tEmail_2.Value)\n                ),\n                \"Please complete all required fields before proceeding.\",\n                \n                If(\n                    !IsBlank(LookUp(Anmeldungen, Email = tEmail_2.Value)),\n                    \"You have already registered with this email address.\",\n                    \"You are already registered for this event.\"\n                )\n            )\n        },\n        Notify(notifyMessage, NotificationType.Warning);\n        Set(varShowSpinner, false)\n    ),\n\n    // Alles ist OK → Patch\n    With(\n        {\n            result: Patch(\n                Anmeldungen,\n                Defaults(Anmeldungen),\n                {\n                    Title: tGivenName_2.Value & \" \" & tLastName_2.Value,\n                    Anrede: cbAnrede_2.Selected.Value,\n                    Vorname: tGivenName_2.Value,\n                    Nachname: tLastName_2.Value,\n                    'CompanyName (field_17)': Coalesce(tCompany_1.Value, \"Keine Angabe\"),\n                    Department: Coalesce(tDepatment_1.Value, \"Keine Angabe\"),\n                    Email: tEmail_2.Value,\n                    ItemID: Gallery3.Selected.ID,\n                    EventType: { Value: \"JPMorgan\" }\n                }\n            )\n        },\n        Set(varShowSpinner, false);\n        Navigate(ScreenSuccessRegistration, ScreenTransition.Fade)\n    )\n);\n"
