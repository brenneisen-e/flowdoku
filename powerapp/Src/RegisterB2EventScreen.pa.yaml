                            RGBA(255, 0, 0, 1) // Rot: Standard für nicht gefundene E-Mail
                        )
                    )
                  Height: =60
                  Text: "=If(\r\n    varAssistancetrue = true,\r\n    \r\n    // Für anderen Benutzer registrieren\r\n    If( \r\n        !IsBlank(tEmail_1.Value) && !IsError(Office365Users.UserProfile(tEmail_1.Value)),\r\n        \r\n        If(   \r\n            varEventCheck.registered = \"True\",  // Variable verwenden\r\n            Office365Users.UserProfile(tEmail_1.Value).GivenName & \" is already registered for the event\",\r\n            \r\n            If( \r\n                !IsBlank(LookUp(Anmeldungen, Email = tEmail_1.Value && ItemID = Gallery3.Selected.ID)), \r\n                \"The registration for \" & Office365Users.UserProfile(tEmail_1.Value).GivenName & \" is currently being processed\", \r\n                \"Please proceed to register \" & Office365Users.UserProfile(tEmail_1.Value).GivenName\r\n            ) \r\n        ),\r\n        \"The email could not be found\"\r\n    ),\r\n    \r\n    // Für sich selbst registrieren\r\n    If(  \r\n        varEventCheck.registered = \"True\",  // Variable verwenden\r\n        \"You are already registered for the event\",\r\n        \r\n        If( \r\n            !IsBlank(LookUp(Anmeldungen, Email = tEmail_1.Value && ItemID = Gallery3.Selected.ID)), \r\n            \"Your registration is currently being processed. This may take a moment. You will receive an automated email after completion\", \r\n            \" \"\r\n        ) \r\n    )\r\n)"
                  VerticalAlign: =VerticalAlign.Middle
                  Visible: =!IsBlank(Gallery3.Selected) && !IsBlank(Gallery3.Selected.ID)
                  Weight: ='TextCanvas.Weight'.Semibold
