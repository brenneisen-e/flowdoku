                                    - Container24_13:
                                        Control: GroupContainer@1.3.0
                                        Variant: ManualLayout
                                        Properties:
                                          AlignInContainer: =AlignInContainer.SetByContainer
                                          DropShadow: =DropShadow.None
                                          Height: =40
                                          LayoutMinWidth: =150
                                        Children:
                                          - ButtonCanvas1_20:
                                              Control: Button@0.0.45
                                              Properties:
                                                Align: =Align.Center
                                                Appearance: |+
                                                  =If(
                                                      Or(
                                                          CheckboxCanvas1_19.Checked = false,  // Wenn das Kontrollkästchen nicht angekreuzt ist
                                                          IsBlank(cbAnrede.Selected.Value),    // Wenn das Anrede-Feld leer ist
                                                          IsBlank(tGivenName.Value),           // Wenn der Vorname leer ist
                                                          IsBlank(tLastName.Value),            // Wenn der Nachname leer ist
                                                          IsBlank(tEmail.Value),               // Wenn die E-Mail leer ist
                                                          IsBlank(cbStartBlcok.Selected.Value) // Wenn das Startblock-Feld leer ist
                                                      ),
                                                      "Warning",  // Farbe, wenn Felder fehlen (Sekundäre Farbe - z.B. Grau)
                                                      If(
                                                          LookUp(Events, Title = Gallery3.Selected.Title).ID in ShowColumns(LookUp('Event visitors', Email = tEmail.Value).'Event registered', Value),
                                                          "Warning",  // Farbe, wenn der Benutzer bereits registriert ist (z.B. Gelb)
                                                          "Primary"   // Andernfalls die primäre Farbe (z.B. Blau) für einen aktiven Button
                                                      )
                                                  )
                                                BorderStyle: =BorderStyle.Solid
                                                BorderThickness: =0
                                                DisplayMode: =
                                                Height: =30
                                                Icon: ="Send"
                                                IconStyle: ='ButtonCanvas.IconStyle'.Outline
                                                OnSelect: "=// SOFORT SPINNER ANZEIGEN\nSet(varShowSpinner, true);\n\n// Grundlegende Validierung und Datenverarbeitung\nIf(\n    Or(\n        CheckboxCanvas1_19.Checked = false,\n        IsBlank(cbAnrede.Selected.Value),\n        IsBlank(tGivenName.Value),\n        IsBlank(tLastName.Value),\n        IsBlank(tEmail.Value),\n        IsBlank(cbStartBlcok.Selected.Value)\n    ),\n    // SPINNER AUSBLENDEN BEI FEHLER\n    Set(varShowSpinner, false);\n    Notify(\"Please fill out all required fields\", NotificationType.Error, 6000),\n   \n    // Prüfen ob bereits für Event registriert\n    If(\n        Or(\n            // NUTZE DIE VARIABLE STATT FLOW!\n            varEventCheck.registered = \"True\",\n            // Prüfen, ob die E-Mail in \"Anmeldungen\" schon vorhanden ist\n            !IsBlank(LookUp('Anmeldungen', Email = tEmail.Value && ItemID = Gallery3.Selected.ID))\n        ),\n        // SPINNER AUSBLENDEN BEI FEHLER\n        Set(varShowSpinner, false);\n        Notify(\"You are already registered for the event as a participant or on the waiting list\", NotificationType.Error, 6000),\n       \n        // Direkt in SharePoint patchen\n        With(\n            {\n                result: Patch(\n                    'Anmeldungen',\n                    Defaults('Anmeldungen'),\n                    {\n                        Title: tGivenName.Value & \" \" & tLastName.Value,\n                        Anrede: cbAnrede.Selected.Value,\n                        Vorname: tGivenName.Value,\n                        Nachname: tLastName.Value,\n                        Email: tEmail.Value,\n                        ItemID: Gallery3.Selected.ID,\n                        Allergies: Text(cbStartBlcok.Selected.Value),\n                        Anonym: cbAnonym.Selected.Value,\n                        Gruppe: \"NO\",\n                        StraßeUndHausnummer: Coalesce(tStreet.Value, \" \"),\n                        Stadt: Coalesce(tCity.Value, \" \"),\n                        Mobilnummer: Coalesce(tNumber.Value, \" \"),\n                        VerwendungInfoservice: cbUsageInfoservice.Selected.Value,\n                        Altersklasse: cbAgeClass.Selected.Value,\n                        NordicWalker: cbNordicWalker.Selected.Value,\n                        TShirtGroesse: If(Gallery3.Selected.'T Shirt Größe visible', If(IsBlank(cbTshirtGroesse.Selected.Value), \"Kein Shirt\", cbTshirtGroesse.Selected.Value), \"N/A\"),\n                        PraeferenzDurchstarter: If(cDurchstarter.Checked, \"Durchstarter\", \"FunRunner\"),\n                        EventType: {Value: \"B2Run\"}\n                    }\n                )\n            },\n            // Spinner ausblenden und Erfolgsmeldung anzeigen\n            Set(varShowSpinner, false);\n            \n            // Navigiere zur Erfolgsseite\n            Navigate(ScreenSuccessRegistration, ScreenTransition.Fade);\n            \n            // Erfolgsbenachrichtigung\n            Notify(\"You have successfully registered for the event!\", NotificationType.Success, 6000)\n        )\n    )\n)"
                                                Text: ="Register"
                                                VerticalAlign: =VerticalAlign.Middle
                                                Width: =120
                                                X: =44
                                                Y: =8
