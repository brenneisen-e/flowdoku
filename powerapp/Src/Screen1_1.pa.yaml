Screens:
  Screen1_1:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
    Children:
      - ScreenContainer9_1:
          Control: GroupContainer@1.3.0
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(245, 245, 245, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =16
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =16
            Width: =Parent.Width
          Children:
            - HeaderContainer3_2:
                Control: GroupContainer@1.3.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =75
                  LayoutDirection: =LayoutDirection.Horizontal
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                Children:
                  - Header3_2:
                      Control: Header@0.0.44
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 1)
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =0
                        Fill: =RGBA(255, 255, 255, 1)
                        FontColor: =RGBA(0, 0, 0, 1)
                        Logo: =AdobeStock_131107922
                        LogoTooltip: ="Back"
                        OnSelectLogo: =Navigate(StartScreen)
                        Title: ="My Events"
            - MainContainer2_2:
                Control: GroupContainer@1.3.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Parent.Fill
                  Height: =800
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutWrap: =true
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Width: =1300
                Children:
                  - Gallery3_1:
                      Control: Gallery@2.15.0
                      Variant: BrowseLayout_Horizontal_TwoTextOneImageOverlayVariant_ver5.0
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Items: =If(IsBlank(LookUp(Admins,'Admin Account'.Email =User().Email).'Admin Account'.Email), Filter(Events,(CurrentUser.Office in Standort.Value ||"ALL" in Standort.Value) && Status.Value = "Active" ), Events)
                        Width: =1300
                      Children:
                        - Image7_1:
                            Control: Image@2.2.3
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Height: =Parent.TemplateHeight - 32
                              Image: =If(IsBlank(ThisItem.'Event image'),B2RunLogo,ThisItem.'Event image'.Full)
                              ImagePosition: =ImagePosition.Fill
                              OnSelect: =Select(Parent)
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Width: =Parent.TemplateWidth - 32
                              X: =16
                              Y: =16
                        - Overlay2_1:
                            Control: Rectangle@2.3.0
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Fill: =RGBA(0, 0, 0, 0.6)
                              Height: =176
                              OnSelect: =Select(Parent)
                              Width: =Image7_1.Width
                              X: =Image7_1.X
                              Y: =399
                        - Title5_1:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 1)
                              Color: =RGBA(255, 255, 255, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =67
                              OnSelect: =Select(Parent)
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =20
                              Text: =ThisItem.Title
                              VerticalAlign: =VerticalAlign.Top
                              Width: =279
                              X: =32
                              Y: =462
                        - Subtitle4_1:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 1)
                              Color: =RGBA(255, 255, 255, 1)
                              Font: =Font.'Open Sans'
                              Height: =Self.Size * 1.8
                              OnSelect: =Select(Parent)
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =18
                              Text: =Text(ThisItem.'Event time', "[$-de-DE]dd.mm.yyyy HH:mm")
                              VerticalAlign: =VerticalAlign.Top
                              Width: =Title5_1.Width
                              X: =Title5_1.X
                              Y: =542.6
                        - ButtonCanvas2_1:
                            Control: Button@0.0.45
                            Properties:
                              DisplayMode: |+
                                =If(IsBlank(LookUp(Admins,'Admin Account'.Email =User().Email).'Admin Account'.Email),If(
                                    ThisItem.ID in ShowColumns(LookUp('Event visitors', Email = CurrentUser.Email).'Event registered', Value),
                                    DisplayMode.Disabled, 
                                    DisplayMode.Edit
                                ),DisplayMode.Edit)

                              OnSelect: |+
                                =Select(Parent);
                                Navigate(ScreenEditEvent);
                                Set(varModalDialog, false);
                              Text: ="Edit"
                              X: =311
                              Y: =543
                        - TextCanvas1_1:
                            Control: Text@0.0.51
                            Properties:
                              FontColor: =RGBA(255, 255, 255, 1)
                              Height: =25
                              Text: =Concat(ThisItem.Standort,Value, "; ")
                              Width: =300
                              X: =32
                              Y: =526
                        - TextCanvas6_1:
                            Control: Text@0.0.51
                            Properties:
                              FontColor: =RGBA(255, 255, 255, 1)
                              Height: =34
                              Text: |-
                                ="Warteliste: " & ThisItem.'Wait list'
                              Visible: =If(ThisItem.'Wait list'>0,true,false)
                              Width: =129
                              X: =311
                              Y: =462
                        - TextCanvas11_1:
                            Control: Text@0.0.51
                            Properties:
                              Text: |+
                                =//Find(ThisItem.ID,Concat(LookUp('Event visitors',Email = User().Email,'Event registered'),Value))
                                //Concat(LookUp(LookUp('Event visitors',Email = User().Email,'Event registered'),Value),Id = ThisItem.ID)),Value)
                                //Find(First(colFilterSelection).Sector, Concat('Sector relevance'.Value, Value & ",")

                                //Concat(LookUp(LookUp('Event visitors',Email = User().Email,'Event registered'),Id=ThisItem.ID),Value)
                                //ThisItem.ID in LookUp('Event visitors',Email = User().Email,'Event registered')

                              X: =149
                              Y: =151
                        - InfoButtonCanvas10_5:
                            Control: InfoButton@0.0.33
                            Properties:
                              Content: =ThisItem.'Event description'
                              Height: =60
                              IconColor: =RGBA(0, 0, 0, 1)
                              Width: =60
                              X: =32
                              Y: =43
